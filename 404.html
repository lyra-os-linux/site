<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex">
    <title>Página não encontrada — Lyra OS</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/style.css">
    <style>
      .lost { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 48px 24px; background: radial-gradient(circle at 50% 30%, var(--surface-blue), var(--bg) 62%); }
      .lost-card { max-width: 560px; text-align: center; }
      .lost .lost-code { font: 600 clamp(4.5rem, 16vw, 8rem)/1 var(--serif); letter-spacing: -.04em; background: linear-gradient(100deg, var(--lavender), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0; }
      .lost-euri { width: min(240px, 60vw); height: auto; margin: 8px auto 4px; display: block; animation: lost-float 5s ease-in-out infinite; filter: drop-shadow(0 18px 30px rgba(40, 52, 100, .18)); }
      .lost h1 { font: 600 clamp(1.6rem, 4vw, 2.2rem)/1.2 var(--serif); margin: 12px 0 10px; color: var(--text); }
      .lost p { color: var(--text-soft); line-height: 1.6; margin: 0 auto 8px; max-width: 46ch; }
      .lost .lost-en { color: var(--text-muted); font-size: .9rem; }
      .lost-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 26px; }
      @keyframes lost-float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
      @media (prefers-reduced-motion: reduce) { .lost-euri { animation: none; } }
    </style>
  </head>
  <body>
    <main class="lost">
      <div class="lost-card">
        <p class="lost-code" aria-hidden="true">404</p>
        <img class="lost-euri" src="/assets/euri/euri.webp" width="640" height="600" alt="Euri, a raposa roxa mascote do Lyra OS, de moletom e fones.">
        <h1>A Euri procurou por toda a constelação…</h1>
        <p>…mas esta página não está aqui. Talvez o endereço tenha mudado ou tenha um erro de digitação.</p>
        <p class="lost-en" lang="en">Euri searched the whole constellation, but this page isn't here.</p>
        <div class="lost-actions">
          <a class="button button-primary" href="/">Voltar ao início</a>
          <a class="button button-secondary" href="/docs/index.html">Ver a documentação</a>
        </div>
      </div>
    </main>
  </body>
</html>
