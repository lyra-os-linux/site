name: Check documentation
on:
  pull_request:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/build-docs.py
      - run: python3 scripts/check-docs.py
      - name: Check generated files are current
        run: git diff --exit-code -- docs sitemap.xml
